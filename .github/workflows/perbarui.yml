name: Perbarui berita

on:
  schedule:
    # 08.00, 11.00, dan 15.00 WIB (jam UTC = WIB − 7).
    # Samakan dengan jamPembaruan di laju.config.mjs bila diubah.
    # Menit 23 dipilih karena jadwal GitHub paling sering tertunda pada menit 00.
    - cron: "23 1,4,8 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["data/**", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: perbarui-berita
  cancel-in-progress: false

jobs:
  perbarui:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.terbit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ambil berita
        run: node scripts/ambil-berita.mjs

      - name: Ambil skor sepak bola
        run: node scripts/ambil-skor.mjs

      - name: Ringkasan Pagi (dilewati bila ANTHROPIC_API_KEY belum diatur)
        run: node scripts/ringkasan.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Bangun situs
        run: node scripts/bangun.mjs

      - name: Ringkasan AI berita utama (dilewati bila kunci API belum diatur)
        run: node scripts/ringkas-berita.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Bangun ulang dengan ringkasan
        run: node scripts/bangun.mjs

      - name: Simpan data ke repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Tidak ada berita baru."
          else
            git commit -m "Berita $(TZ=Asia/Jakarta date +'%Y-%m-%d %H.%M') WIB"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: terbit
        uses: actions/deploy-pages@v4
